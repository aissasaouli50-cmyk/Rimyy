<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Rimy ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: 'Georgia', serif;
}

/* =========================
   PAGE 1
========================= */

#page1 {

    width: 100%;
    height: 100vh;

    background:
    radial-gradient(circle at center,
    #ff5252,
    #b00020,
    #45000c);

    display: flex;
    justify-content: center;
    align-items: center;

    flex-direction: column;

    color: white;

    position: absolute;

    transition: 1.5s;
}

.title {

    font-size: 65px;

    font-weight: bold;

    letter-spacing: 5px;

    margin-bottom: 25px;

    text-shadow:
    0 0 10px pink,
    0 0 30px red;

    animation: glow 2s infinite alternate;
}

.subtitle {

    font-size: 22px;

    letter-spacing: 2px;

    margin-bottom: 45px;

    text-align: center;
}

.enter-btn {

    padding: 17px 45px;

    border: 2px solid white;

    background: transparent;

    color: white;

    font-size: 20px;

    border-radius: 40px;

    cursor: pointer;

    transition: 0.4s;

}

.enter-btn:hover {

    background: white;

    color: #b00020;

    transform: scale(1.12);

    box-shadow: 0 0 30px white;

}

/* Floating hearts */

.floating-heart {

    position: absolute;

    color: #ffb6c1;

    font-size: 25px;

    animation: float 7s linear infinite;

    opacity: 0.6;

}

@keyframes float {

    0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
    }

    30% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
    }

}

@keyframes glow {

    from {
        text-shadow: 0 0 10px pink;
    }

    to {
        text-shadow:
        0 0 20px white,
        0 0 50px pink;
    }

}

/* =========================
   PAGE 2
========================= */

#page2 {

    width: 100%;
    height: 100vh;

    background: radial-gradient(
        circle,
        #19000c,
        #000000
    );

    position: absolute;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    opacity: 0;

    visibility: hidden;

    transition: 2s;

}

canvas {

    position: absolute;

    width: 100%;
    height: 100%;

}

#loveText {

    position: absolute;

    color: white;

    font-size: clamp(20px, 4vw, 35px);

    font-weight: bold;

    text-shadow:
    0 0 10px pink,
    0 0 25px #ff1493;

    opacity: 0;

    transform: scale(0.5);

    transition: 2s;

    text-align: center;

    z-index: 5;

    white-space: nowrap;

}

/* Music button */


/* Mobile */

@media(max-width:600px) {

    .title {
        font-size: 43px;
    }

    .subtitle {
        font-size: 17px;
    }

}

</style>

</head>

<body>

<!-- MUSIC -->

<audio id="music" loop>
    <source src="Edd_Sheeran_-_Perfect_(mp3.pm).mp3" type="audio/mpeg">
</audio>


<!-- =========================
     FIRST PAGE
========================= -->

<section id="page1">

    <h1 class="title">Rimy ❤️</h1>

    <p class="subtitle">
        I want to tell you something...
    </p>

    <button class="enter-btn" onclick="enterLove()">
        Enter ❤️
    </button>

</section>


<!-- =========================
     SECOND PAGE
========================= -->

<section id="page2">

    <canvas id="heartCanvas"></canvas>

    <h1 id="loveText">
        I Love You Rimy ❤️
    </h1>

</section>
<script>

/* =========================
   FLOATING HEARTS
========================= */

const page1 = document.getElementById("page1");

function createFloatingHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    heart.innerHTML = "❤";

    heart.style.left = Math.random() * 100 + "%";

    heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    heart.style.fontSize =
        (15 + Math.random() * 30) + "px";

    page1.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);

}

setInterval(createFloatingHeart, 400);


/* =========================
   ENTER PAGE
========================= */

let started = false;

function enterLove() {

    if (started) return;

    started = true;

    const music = document.getElementById("music");

    music.volume = 0.7;

    music.play().catch(error => {
        console.log("Music could not start:", error);
    });

    page1.style.opacity = "0";

    page1.style.transform = "scale(1.3)";

    setTimeout(() => {

        page1.style.display = "none";

        const page2 = document.getElementById("page2");

        page2.style.visibility = "visible";

        page2.style.opacity = "1";

        startHeart();

    }, 1500);

}


/* =========================
   PARTICLE HEART
========================= */

function startHeart() {

    const canvas = document.getElementById("heartCanvas");

    const ctx = canvas.getContext("2d");

    const loveText = document.getElementById("loveText");

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

    const centerX = canvas.width / 2;

    const centerY = canvas.height / 2;

    const scale = Math.min(
        canvas.width / 38,
        canvas.height / 43
    );

    const particles = [];

    const total = 4500;

    let frame = 0;


    /* HEART EQUATION */

    for (let i = 0; i < total; i++) {

        let t = Math.random() * Math.PI * 2;

        let r = Math.sqrt(Math.random());

        let hx = 16 * Math.pow(Math.sin(t), 3);

        let hy =
            13 * Math.cos(t)
            - 5 * Math.cos(2*t)
            - 2 * Math.cos(3*t)
            - Math.cos(4*t);

        let targetX = centerX + hx * r * scale;

        let targetY = centerY - hy * r * scale;

        let angle = Math.random() * Math.PI * 2;

        let distance = Math.random() * 8;

        particles.push({

            x: centerX,
            y: centerY,

            startX: centerX + Math.cos(angle) * distance * scale,

            startY: centerY + Math.sin(angle) * distance * scale,

            targetX: targetX,

            targetY: targetY,

            size: Math.random() * 2.5 + 0.5,

            color: [
                "#ff1493",
                "#ff69b4",
                "#ffb6c1",
                "#ffffff"
            ][Math.floor(Math.random() * 4)]

        });

    }


    /* ANIMATION */

    function animate() {

        frame++;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        let progress = Math.min(frame / 180, 1);

        let smooth = 1 - Math.pow(1 - progress, 3);

        let pulse = 1;

        if (progress >= 1) {

            pulse = 1 + 0.025 * Math.sin(frame * 0.08);

        }


        particles.forEach(p => {

            let x = p.startX +
                (p.targetX - p.startX) * smooth;

            let y = p.startY +
                (p.targetY - p.startY) * smooth;

            x = centerX + (x - centerX) * pulse;

            y = centerY + (y - centerY) * pulse;


            /* PARTICLE GLOW */

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = p.color;

            ctx.shadowBlur = 12;

            ctx.shadowColor = "#ff1493";

            ctx.fill();

        });


        ctx.shadowBlur = 0;


        /* SHOW TEXT AFTER HEART COMPLETES */

        if (progress >= 1) {

            loveText.style.opacity = "1";

            loveText.style.transform = "scale(1)";

        }


        requestAnimationFrame(animate);

    }

    animate();

}


/* =========================
   RESIZE
========================= */

window.addEventListener("resize", () => {

    const canvas = document.getElementById("heartCanvas");

    if (canvas) {

        canvas.width = window.innerWidth;

        canvas.height = window.innerHeight;

    }

});

</script>

</body>

</html>
